serenity {
  outputDirectory = "target/site/serenity/reports"
  browser.maximized = true
  console.colors = true
  encoding = "UTF-8"
  compress.filenames = true
  take.screenshots = "FOR_EACH_ACTION"
}

headless.mode = false

webdriver {
  driver = "chrome"

  capabilities {
    "goog:chromeOptions" {
      args = [
        "start-maximized",
        "lang=es",
        "test-type",
        "disable-popup-blocking",
        "disable-download.notification",
        "disable-translate",
        "disable-extensions",
        "disable-gpu",
        "always-authorize-plugins",
        "no-sandbox",
        "ignore-certificate-errors",
        "allow-running-insecure-content",
        "remote-allow-origins=*"
      ]
    }
  }
}

environments {
    default {
        webdriver.base.url = "https://thinking-tester-contact-list.herokuapp.com"
    }
}
